---
- name: Setup server
  hosts: all
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install system tools
      apt:
        name:
          - docker.io
          - docker-compose
        state: present

    - name: Copy docker-compose.yml to server
      copy:
        src: ../docker-compose.yml
        dest: /home/ubuntu/docker-compose.yml

    - name: Tear down existing containers
      command: docker-compose down
      args:
        chdir: /home/ubuntu
      ignore_errors: yes

    - name: Docker image cleanup
      command: docker image prune -af
      ignore_errors: yes

    - name: Create a network
      community.docker.docker_network:
        name: app_network

    - name: Start App and DB
      command: docker-compose up -d
      args:
        chdir: /home/ubuntu

    - name: Wait for database to initialise
      wait_for:
        timeout: 20

    - name: Copy prometheus configuration
      copy:
        src: prometheus.yml
        dest: /home/ubuntu/prometheus.yml

    - name: Copy alert rules
      copy:
        src: alert_rules.yml
        dest: /home/ubuntu/alert_rules.yml

    - name: Copy alertmanager configuration
      template:
        src: alertmanager.yml
        dest: /home/ubuntu/alertmanager.yml
      vars:
        slack_webhook_url: "{{ lookup('env', 'SLACK_WEBHOOK_URL') }}"

    - name: Run Alertmanager container
      community.docker.docker_container:
        name: alertmanager
        image: prom/alertmanager
        state: started
        restart_policy: always
        ports:
          - "9093:9093"
        volumes:
          - /home/ubuntu/alertmanager.yml:/etc/alertmanager/alertmanager.yml
        networks:
          - name: app_network

    - name: Run Prometheus Container
      community.docker.docker_container:
        name: prometheus
        image: prom/prometheus
        state: started
        restart_policy: always
        ports:
          - "9090:9090"
        volumes:
          - /home/ubuntu/prometheus.yml:/etc/prometheus/prometheus.yml
          - /home/ubuntu/alert_rules.yml:/etc/prometheus/alert_rules.yml
        networks:
          - name: app_network

    - name: Create Grafana Datasource Config
      copy:
        dest: /home/ubuntu/datasource.yml
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true

    - name: Run Grafana Container
      community.docker.docker_container:
        name: grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: always
        ports:
          - "3000:3000"
        networks:
          - name: app_network
        volumes:
          - /home/ubuntu/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
